# Local, persistent API stack. Public deployment requires HTTPS origins and a
# reverse proxy/host; this file intentionally binds host ports to loopback.
x-api: &api
  image: circle-api:local
  build:
    context: ./server
  init: true
  environment:
    NODE_ENV: development
    HOST: 0.0.0.0
    PORT: '8787'
    DATABASE_URL: postgresql://circle:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}@db:5432/circle
    AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    API_URL: ${API_URL:-http://localhost:8787}
    APP_URL: ${APP_URL:-http://localhost:8081}
    MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circle
      POSTGRES_USER: circle
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - circle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *api
    command: ['npm', 'run', 'migrate']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  circle-postgres-data:
